services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true

    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api-tests:
    profiles:
      - test
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    init: true

    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"

    depends_on:
      db:
        condition: service_healthy

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
