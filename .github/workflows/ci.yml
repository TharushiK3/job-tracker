name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting and lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test API client
        run: npm run test:api

      - name: Build Next.js
        # Synthetic values for compilation only. They cannot sign in real users.
        # The publishable key encodes ci.clerk.invalid$; no Clerk secrets are used.
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuaW52YWxpZCQ
          CLERK_SECRET_KEY: sk_test_ci_unused
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: job_tracker
          POSTGRES_USER: job_tracker_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U job_tracker_admin -d job_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable credentials for this job's PostgreSQL service only.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: job_tracker
      DB_USER: job_tracker_app
      DB_PASSWORD: ci-app-password
      MIGRATION_DB_HOST: 127.0.0.1
      MIGRATION_DB_PORT: "5432"
      MIGRATION_DB_NAME: job_tracker
      MIGRATION_DB_USER: job_tracker_migrator
      MIGRATION_DB_PASSWORD: ci-migration-password
      CLERK_SECRET_KEY: sk_test_ci_unused
      CLERK_ISSUER: https://ci.clerk.invalid
      CLERK_AUTHORIZED_PARTIES: '["http://localhost:3000","http://127.0.0.1:3000"]'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Create application and migration roles
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$CI_POSTGRES_CONTAINER" \
            psql -U job_tracker_admin -d job_tracker -v ON_ERROR_STOP=1 -f - \
            < sql/create_app_role.sql

          docker exec -i "$CI_POSTGRES_CONTAINER" \
            psql -U job_tracker_admin -d job_tracker -v ON_ERROR_STOP=1 -f - \
            < sql/create_migration_role.sql

          docker exec -i "$CI_POSTGRES_CONTAINER" \
            psql -U job_tracker_admin -d job_tracker -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE job_tracker_app PASSWORD 'ci-app-password';
          ALTER ROLE job_tracker_migrator PASSWORD 'ci-migration-password';
          SQL

      - name: Apply migrations and check schema
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
